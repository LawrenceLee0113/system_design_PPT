<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>五種簡報風格選擇</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f8f4;
        color: #151713;
        font-family: Inter, "Noto Sans TC", "PingFang TC", Arial, sans-serif;
      }
      main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0;
      }
      h1 {
        max-width: 820px;
        margin: 0 0 12px;
        font-size: clamp(2.5rem, 7vw, 5.8rem);
        line-height: 0.98;
      }
      p {
        max-width: 720px;
        color: #657068;
        font-size: 1.15rem;
        line-height: 1.75;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
        margin-top: 36px;
      }
      a {
        min-height: 260px;
        display: grid;
        align-content: end;
        gap: 10px;
        padding: 20px;
        border: 1px solid rgba(21, 23, 19, 0.1);
        border-radius: 10px;
        background: #ffffff;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 14px 38px rgba(21, 23, 19, 0.08);
      }
      a:nth-child(1) { background: linear-gradient(150deg, #f7f9f6 0 40%, #151713 40%); color: #ffffff; }
      a:nth-child(2) { background: linear-gradient(150deg, #00d4c3 0 36%, #080b10 36%); color: #ecf6f6; }
      a:nth-child(3) { background: linear-gradient(150deg, #fbf6ea 0 40%, #7b241c 40%); color: #fff7ed; }
      a:nth-child(4) { background: linear-gradient(150deg, #f9fbff 0 38%, #22518b 38%); color: #ffffff; }
      a:nth-child(5) { background: linear-gradient(150deg, #ffffff 0 38%, #12a88f 38%); color: #ffffff; }
      strong {
        font-size: 1.35rem;
      }
      span {
        color: currentColor;
        opacity: 0.76;
        line-height: 1.5;
      }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
        a { min-height: 180px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>五種系統流程開發簡報風格</h1>
      <p>每個卡片都會開啟一份獨立的 `index.html`，內容相同、視覺風格不同，方便你挑一個最適合簡報場合的版本。</p>
      <section class="grid" aria-label="風格選擇">
        <a href="./style-01-executive/index.html"><strong>01 企業顧問風</strong><span>正式、清楚、適合課堂報告或主管簡報。</span></a>
        <a href="./style-02-tech-dark/index.html"><strong>02 科技深色風</strong><span>深色介面、技術感強，適合工程與產品場合。</span></a>
        <a href="./style-03-editorial/index.html"><strong>03 編輯雜誌風</strong><span>紙本刊物感，適合重視敘事與質感的報告。</span></a>
        <a href="./style-04-blueprint/index.html"><strong>04 流程藍圖風</strong><span>格線與藍圖語彙，強調系統規劃與流程設計。</span></a>
        <a href="./style-05-product/index.html"><strong>05 活潑產品風</strong><span>明亮友善，適合介紹案例與產品開發流程。</span></a>
      </section>
    </main>
  </body>
</html>
