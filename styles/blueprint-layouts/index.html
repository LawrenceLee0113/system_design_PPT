<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>藍圖排版參考選擇</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #dfe9f5;
        color: #10243d;
        font-family: "Avenir Next", Inter, "Noto Sans TC", Arial, sans-serif;
      }
      main {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0;
      }
      h1 {
        max-width: 860px;
        margin: 0 0 14px;
        font-size: clamp(2.6rem, 7vw, 5.8rem);
        line-height: 0.98;
      }
      p {
        max-width: 760px;
        color: #52677f;
        font-size: 1.15rem;
        line-height: 1.75;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-top: 34px;
      }
      a {
        display: grid;
        align-content: end;
        min-height: 260px;
        padding: 22px;
        border: 2px solid rgba(34, 81, 139, 0.22);
        background:
          linear-gradient(rgba(34, 81, 139, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 81, 139, 0.1) 1px, transparent 1px),
          #f9fbff;
        background-size: 24px 24px;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 18px 42px rgba(34, 81, 139, 0.14);
      }
      a:first-child {
        background:
          linear-gradient(rgba(220, 236, 255, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(220, 236, 255, 0.12) 1px, transparent 1px),
          #0d2748;
        background-size: 24px 24px;
        color: #ffffff;
      }
      strong {
        display: block;
        margin-bottom: 10px;
        font-size: 1.28rem;
      }
      span {
        color: currentColor;
        opacity: 0.76;
        line-height: 1.55;
      }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
        a { min-height: 170px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>藍圖風排版參考</h1>
      <p>第一個是你選中的原版複製，後面三個是額外延伸版本：策略提案、營運儀表、產品路線。內容不再限制於系統開發，可作為之後實際製作簡報時的頁型參考。</p>
      <section class="grid" aria-label="藍圖排版選擇">
        <a href="../blueprint-reference-copy/index.html"><strong>原版複製</strong><span>保留你覺得不錯的流程藍圖風。</span></a>
        <a href="../blueprint-layout-01-strategy/index.html"><strong>01 策略提案藍圖</strong><span>背景、選項矩陣、路線圖、決策請求。</span></a>
        <a href="../blueprint-layout-02-operations/index.html"><strong>02 營運儀表藍圖</strong><span>KPI、流程、風險熱點、責任矩陣。</span></a>
        <a href="../blueprint-layout-03-product/index.html"><strong>03 產品路線藍圖</strong><span>使用者旅程、功能架構、上市規劃。</span></a>
      </section>
    </main>
  </body>
</html>
